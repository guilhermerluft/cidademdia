name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CidadeEmDia.sln

      - name: Build
        run: dotnet build CidadeEmDia.sln -c Release --no-restore

      - name: Test
        run: dotnet test CidadeEmDia.sln -c Release --no-build --logger 'trx;LogFileName=test-results.trx'

      - name: Materialize Institutions migration
        if: github.event_name == 'push' && github.ref_name == 'feat/institutions-domain'
        shell: bash
        env:
          JWT_SIGNING_KEY: ci-only-signing-key-0123456789abcdef0123456789abcdef
          DATABASE_CONNECTION: Host=localhost;Port=5432;Database=cidademdia_ci;Username=ci;Password=ci
        run: |
          set -euo pipefail

          if find apps/api/src/CidadeEmDia.Infrastructure/Persistence/Migrations \
            -maxdepth 1 -type f -name '*_AddInstitutionsRepresentatives.cs' \
            ! -name '*.Designer.cs' | grep -q .; then
            echo 'Institutions migration already exists; nothing to materialize.'
            exit 0
          fi

          dotnet tool install --global dotnet-ef --version 10.0.11
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet ef migrations add AddInstitutionsRepresentatives \
            --project apps/api/src/CidadeEmDia.Infrastructure/CidadeEmDia.Infrastructure.csproj \
            --startup-project apps/api/src/CidadeEmDia.Api/CidadeEmDia.Api.csproj

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/CidadeEmDia.Infrastructure/Persistence/Migrations
          git commit -m 'feat(institutions): add institutions migration'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
