name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CidadeEmDia.sln

      - name: Build
        run: dotnet build CidadeEmDia.sln -c Release --no-restore

      - name: Test
        run: dotnet test CidadeEmDia.sln -c Release --no-build --logger 'trx;LogFileName=test-results.trx'

      - name: Preview Content migration
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 10.0.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add AddContentPostsPlacements \
            --project apps/api/src/CidadeEmDia.Infrastructure/CidadeEmDia.Infrastructure.csproj \
            --startup-project apps/api/src/CidadeEmDia.Api/CidadeEmDia.Api.csproj
          MIGRATION_FILE="$(find apps/api/src/CidadeEmDia.Infrastructure/Persistence/Migrations -maxdepth 1 -type f -name '*_AddContentPostsPlacements.cs' ! -name '*.Designer.cs' | head -n 1)"
          echo '=== CONTENT_MIGRATION_FILE_BEGIN ==='
          cat "$MIGRATION_FILE"
          echo '=== CONTENT_MIGRATION_FILE_END ==='
          echo '=== CONTENT_SNAPSHOT_DIFF_BEGIN ==='
          git diff -- apps/api/src/CidadeEmDia.Infrastructure/Persistence/Migrations/AppDbContextModelSnapshot.cs
          echo '=== CONTENT_SNAPSHOT_DIFF_END ==='

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
