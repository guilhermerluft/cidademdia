name: Generate subaccounts migration

on:
  push:
    branches:
      - feat/master-subaccounts-permissions

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_CONNECTION: Host=localhost;Port=5432;Database=cidademdia;Username=cidademdia;Password=ci-only
      JWT_ISSUER: CidadeEmDia
      JWT_AUDIENCE: CidadeEmDia.Web
      JWT_SIGNING_KEY: ci-only-signing-key-with-more-than-thirty-two-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CidadeEmDia.sln

      - name: Install EF CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 10.0.11

      - name: Generate migration
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'apps/api/src/CidadeEmDia.Infrastructure/Persistence/Migrations/*_AddMasterSubaccounts.cs' > /dev/null; then
            echo 'AddMasterSubaccounts migration already exists.'
            exit 0
          fi

          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" migrations add AddMasterSubaccounts \
            --project apps/api/src/CidadeEmDia.Infrastructure/CidadeEmDia.Infrastructure.csproj \
            --startup-project apps/api/src/CidadeEmDia.Api/CidadeEmDia.Api.csproj \
            --output-dir Persistence/Migrations

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git add apps/api/src/CidadeEmDia.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(db): add master subaccounts migration'
          git push origin HEAD:${GITHUB_REF_NAME}
