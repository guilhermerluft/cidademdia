map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $host $seo_x_robots_tag {
    default "";
    homolog.cidademdia.com.br "noindex, nofollow, noarchive";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "$seo_x_robots_tag" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location = /media/como-funciona.mp4 {
        alias /srv/cidademdia-media/como-funciona.mp4;
        add_header Cache-Control "public, max-age=3600";
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
