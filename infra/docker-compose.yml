services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cidademdia}
      POSTGRES_USER: ${POSTGRES_USER:-cidademdia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cidademdia} -d ${POSTGRES_DB:-cidademdia}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: apps/api/src/CidadeEmDia.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DATABASE_CONNECTION: ${DATABASE_CONNECTION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://homolog.cidademdia.com.br}
      JWT_ISSUER: ${JWT_ISSUER:-CidadeEmDia}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-CidadeEmDia.Web}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-https://homolog.cidademdia.com.br/reset-password}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      SUBACCOUNT_INVITE_URL: ${SUBACCOUNT_INVITE_URL:-https://homolog.cidademdia.com.br/}
      SUBACCOUNT_INVITE_HOURS: ${SUBACCOUNT_INVITE_HOURS:-48}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CidadeEmDia}
      SMTP_ENABLE_SSL: ${SMTP_ENABLE_SSL:-true}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_UPLOAD_URL_MINUTES: ${R2_UPLOAD_URL_MINUTES:-10}
      R2_READ_URL_MINUTES: ${R2_READ_URL_MINUTES:-5}
      OCCURRENCE_MEDIA_MAX_IMAGE_BYTES: ${OCCURRENCE_MEDIA_MAX_IMAGE_BYTES:-10485760}
      OCCURRENCE_MEDIA_MAX_VIDEO_BYTES: ${OCCURRENCE_MEDIA_MAX_VIDEO_BYTES:-104857600}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_API_BASE_URL: ${MERCADOPAGO_API_BASE_URL:-https://api.mercadopago.com}
      MERCADOPAGO_BACK_URL: ${MERCADOPAGO_BACK_URL:-https://homolog.cidademdia.com.br/billing/return}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    networks: [edge]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/cidademdia.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
