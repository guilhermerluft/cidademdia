services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cidademdia}
      POSTGRES_USER: ${POSTGRES_USER:-cidademdia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cidademdia} -d ${POSTGRES_DB:-cidademdia}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: apps/api/src/CidadeEmDia.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DATABASE_CONNECTION: ${DATABASE_CONNECTION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://homolog.cidademdia.com.br}
      JWT_ISSUER: ${JWT_ISSUER:-CidadeEmDia}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-CidadeEmDia.Web}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    networks: [edge]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/cidademdia.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
